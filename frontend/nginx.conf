server {
    listen 80;

    # Support root level routing (e.g. http://localhost/)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Support /trustshare/ subfolder routing (e.g. http://localhost/trustshare/)
    location /trustshare {
        alias /usr/share/nginx/html/trustshare;
        index index.html index.htm;
        try_files $uri $uri/ /trustshare/index.html;
    }
}
